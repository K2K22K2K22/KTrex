[project]
name = "KTrex"
version = "0.2.2"
description = "Interactive terminal-based directory structure builder"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "AK" }
]
requires-python = ">=3.10"
dependencies = []
keywords = ["directory", "structure", "scaffold", "tui", "curses", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/K2K22K2K22/KTrex"
Repository = "https://github.com/K2K22K2K22/KTrex"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ktrex = "ktrex.main:main"
KTrex = "ktrex.main:main"

[tool.setuptools.package-data]
ktrex = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
